<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detective ID Card</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Comic Sans MS', 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #2d3436;
  }

  .id-card {
    background: linear-gradient(135deg, #fffdf5 0%, #fff3d6 100%);
    border: 3px solid #f39c12;
    border-radius: 20px;
    padding: 20px;
    width: 100%;
    max-width: 580px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    position: relative;
    overflow: hidden;
  }
  .id-card::before {
    content: "";
    position: absolute;
    top: -50px; right: -50px;
    width: 150px; height: 150px;
    background: radial-gradient(circle, rgba(243,156,18,0.18), transparent 70%);
    border-radius: 50%;
  }

  .id-header {
    display: flex;
    align-items: center;
    gap: 12px;
    background: linear-gradient(135deg, #f39c12, #e67e22);
    color: #fff;
    padding: 12px 16px;
    border-radius: 12px;
    margin-bottom: 16px;
    position: relative;
    z-index: 1;
  }
  .id-badge { font-size: 28px; }
  .id-title {
    font-size: 17px;
    font-weight: bold;
    letter-spacing: 1.5px;
  }
  .id-sub {
    font-size: 11px;
    opacity: 0.9;
    letter-spacing: 0.5px;
  }
  .id-header > div { flex: 1; }

  .id-body {
    display: flex;
    gap: 18px;
    align-items: flex-start;
    position: relative;
    z-index: 1;
  }

  .id-photo {
    flex-shrink: 0;
    width: 120px;
    height: 140px;
    background: #fff;
    border: 3px solid #e67e22;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 6px;
  }
  .id-avatar {
    font-size: 58px;
    line-height: 1;
    animation: catBob 2.5s ease-in-out infinite;
  }
  @keyframes catBob {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }
  .id-photo-label {
    font-size: 9px;
    color: #b07a3f;
    letter-spacing: 1px;
    margin-top: 8px;
  }

  .id-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .id-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    border-bottom: 1px dashed #f0c98a;
    padding-bottom: 6px;
  }
  .id-label {
    color: #b07a3f;
    font-weight: bold;
    min-width: 55px;
  }
  .id-value { color: #2d3436; }

  .id-input {
    border: none;
    border-bottom: 2px solid #f39c12;
    background: transparent;
    font-family: inherit;
    font-size: 15px;
    color: #e67e22;
    font-weight: bold;
    padding: 2px 4px;
    width: 150px;
  }
  .id-input:focus { outline: none; border-bottom-color: #e67e22; }
  .id-input-sm { width: 50px; text-align: center; }
  .id-input-md { width: 115px; text-align: center; }

  .id-input[type="number"]::-webkit-outer-spin-button,
  .id-input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .id-input[type="number"] { -moz-appearance: textfield; }

  .id-avatars {
    margin-top: 16px;
    text-align: center;
    position: relative;
    z-index: 1;
  }
  .id-avatars-label {
    font-size: 12px;
    color: #b07a3f;
    letter-spacing: 0.5px;
  }
  .id-avatars-row {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .avatar-btn {
    font-size: 24px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 2px solid #f0c98a;
    background: #fff;
    cursor: pointer;
    transition: all 0.2s;
    padding: 0;
    line-height: 1;
  }
  .avatar-btn:hover { transform: scale(1.1); border-color: #f39c12; }
  .avatar-btn.active {
    background: #fff3d6;
    border-color: #e67e22;
    box-shadow: 0 0 0 3px rgba(243,156,18,0.3);
  }

  .id-footer {
    display: flex;
    justify-content: space-between;
    margin-top: 16px;
    padding-top: 12px;
    border-top: 2px dashed #f0c98a;
    font-size: 11px;
    color: #b07a3f;
    letter-spacing: 0.5px;
    position: relative;
    z-index: 1;
  }
</style>
</head>
<body>
  <div class="id-card">
    <div class="id-header">
      <span class="id-badge">🕵️</span>
      <div>
        <div class="id-title">DETECTIVE LICENSE</div>
        <div class="id-sub">Junior Detective Division</div>
      </div>
      <span class="id-badge">🐾</span>
    </div>

    <div class="id-body">
      <div class="id-photo">
        <div class="id-avatar" id="id-avatar">🕵️</div>
        <div class="id-photo-label">PHOTO</div>
      </div>

      <div class="id-info">
        <div class="id-row">
          <span class="id-label">Name:</span>
          <input type="text" id="id-name" class="id-input" placeholder="your name" maxlength="16">
        </div>
        <div class="id-row">
          <span class="id-label">Age:</span>
          <input type="number" id="id-age" class="id-input id-input-sm" placeholder="9" min="5" max="14">
          <span class="id-value">years</span>
        </div>
        <div class="id-row">
          <span class="id-label">Rank:</span>
          <span class="id-value">Detective 🥇</span>
        </div>
        <div class="id-row">
          <span class="id-label">Date:</span>
          <input type="text" id="id-date" class="id-input id-input-md" placeholder="dd.mm.yyyy" maxlength="10">
        </div>
        <div class="id-row">
          <span class="id-label">Case:</span>
          <span class="id-value">Find Fluffy 🐱</span>
        </div>
      </div>
    </div>

    <div class="id-avatars">
      <span class="id-avatars-label">Choose your badge:</span>
      <div class="id-avatars-row" id="avatar-row">
        <button class="avatar-btn active" data-emoji="🕵️">🕵️</button>
        <button class="avatar-btn" data-emoji="🐱">🐱</button>
        <button class="avatar-btn" data-emoji="🦊">🦊</button>
        <button class="avatar-btn" data-emoji="🐶">🐶</button>
        <button class="avatar-btn" data-emoji="🦉">🦉</button>
        <button class="avatar-btn" data-emoji="⭐">⭐</button>
      </div>
    </div>

    <div class="id-footer">
      <span>★ Official Document ★</span>
      <span id="id-number">№ 0000</span>
    </div>
  </div>

<script>
  // Автоматическая дата в формате dd.mm.yyyy
  const dateEl = document.getElementById('id-date');
  if (dateEl) {
    const d = new Date();
    const dd = String(d.getDate()).padStart(2, '0');
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const yyyy = d.getFullYear();
    dateEl.value = `${dd}.${mm}.${yyyy}`;
  }

  // Случайный номер удостоверения
  const numEl = document.getElementById('id-number');
  if (numEl) numEl.textContent = '№ ' + Math.floor(1000 + Math.random() * 9000);

  // Выбор аватара
  document.querySelectorAll('.avatar-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.avatar-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('id-avatar').textContent = btn.dataset.emoji;
    });
  });
</script>
</body>
</html>
